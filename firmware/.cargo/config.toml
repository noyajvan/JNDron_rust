[build]
# Xtensa target used by the ESP32-S3 (installed via `espup install`).
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
# `espflash` is the modern replacement for `esptool.py` + monitor.
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.1"
# Baud rate of the *external* UART that talks to the flight controller is set
# in NVS at runtime (see `Bridge`/`Config`), not here.
