[package]
name = "jndron-firmware"
description = "JNDron ESP32-S3 MAVLink telemetry bridge (Rust port of DroneBridge)"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

# This crate is deliberately its own workspace so that the root `cargo test`
# never tries to resolve `esp-idf-svc` (which only builds for Xtensa).
[workspace]

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.5"

[dependencies]
flight-core = { path = "../crates/flight-core" }
esp-idf-svc = "0.53"
esp-idf-hal = "0.47"
esp-idf-sys = "0.38"
anyhow = "1"
log = "0.4"
ws2812-esp32-rmt-driver = "0.6"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
